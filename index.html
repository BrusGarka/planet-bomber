<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

  <meta name="description" content="Bomberman em planetas 3D: explore faixas tropicais, solte bombas e escape das explosões com câmera orbital. Jogue no navegador ou instale no celular.">
  <meta property="og:title" content="Planeta Galaxy Bomberman">
  <meta property="og:description" content="Bomberman em planetas 3D com câmera orbital. Jogue no navegador ou instale no celular.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#05060a">

</head>

<body>
  <div id="phase-select" aria-label="Seleção de fase"></div>
  <div id="hud" hidden>
    <h1>Planeta Galaxy Bomberman</h1>
    <div><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> mover · <span class="k">Espaço</span> bomba · <span class="k">G</span> grid · <span class="k">Esc</span> menu</div>
    <div style="margin-top:6px; opacity:0.7">W/S = Norte/Sul · A/D = Oeste/Leste</div>
  </div>
  <button id="btn-menu" type="button" hidden>← Menu de fases</button>
  <div id="msg"></div>
  <div id="status" hidden></div>
  <div id="debug-hint" hidden>G = debug grid (faixas/colunas)</div>
  <script type="module" src="/src/main.js"></script>
